server:
  port: 8082

spring:
  profiles:
    active: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ai_chat?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  ai:
    dashscope:
      api-key: ${SPRING_AI_DASHSCOPE_API_KEY:placeholder}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com.aichat: DEBUG
    org.springframework.ai: DEBUG

jwt:
  secret: ${JWT_SECRET:changeit-in-production}
  expiration: 86400000

app:
  cors:
    allowed-origins: '*'
  upload-dir: ${APP_UPLOAD_DIR:./uploads}
  file-extract-max-chars: 50000
  chat-context-size: 30
  default-model:
    provider: openai
    model-name: ${APP_DEFAULT_MODEL_NAME:qwen3.6-flash-2026-04-16}
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1

tavily:
  api-key: ${TAVILY_API_KEY:placeholder}
