server:
  port: 8080

spring:
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  ai:
    dashscope:
      api-key: placeholder

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com.aichat: DEBUG
    org.springframework.ai: DEBUG

jwt:
  expiration: 86400000

app:
  upload-dir: ./uploads
  file-extract-max-chars: 50000

tavily:
  api-key: placeholder
